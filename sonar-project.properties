sonar.projectKey=snap-or-slap_Backend
sonar.organization=snap-or-slap

sonar.projectName=Snap Or Slap Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=src/**/__tests__/**/*.test.ts,src/**/*.test.ts,src/**/*.spec.ts

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/docs/**,**/sprints/**,src/**/__tests__/**,src/**/*.test.ts,src/**/*.spec.ts,src/pages/**,src/app/page.tsx,src/app/layout.tsx,src/app/not-found.tsx

sonar.coverage.exclusions=src/**/__tests__/**,src/**/*.test.ts,src/**/*.spec.ts,src/**/*.test.tsx,src/**/*.d.ts,src/pages/**,src/app/page.tsx,src/app/layout.tsx,src/app/not-found.tsx,src/app/api/docs/**,src/app/api/test-data/**,src/lib/db/migrate.ts,src/lib/db/seed.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.qualitygate.wait=true